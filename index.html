<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Forex İşlem Tablosu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background-color: #17212b; color: #f5f5f5; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        th, td { border: 1px solid #2b3a4e; padding: 8px; text-align: center; font-size: 14px; }
        th { background-color: #243549; }
        input { width: 100%; box-sizing: border-box; background: #0e1621; border: 1px solid #2b3a4e; color: white; padding: 6px; text-align: center; }
        .save-btn { background-color: #2ea6ff; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Tarih</th>
                <th>Saat</th>
                <th>Para Birimi</th>
                <th>Lot</th>
                <th>Giriş</th>
                <th>Çıkış</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr>
                <td><input type="date" class="tarih"></td>
                <td><input type="time" class="saat"></td>
                <td><input type="text" class="parabirimi" placeholder="Örn: XAUUSD"></td>
                <td><input type="number" step="0.01" class="lot" placeholder="0.10"></td>
                <td><input type="number" step="0.001" class="giris" placeholder="2500.00"></td>
                <td><input type="number" step="0.001" class="cikis" placeholder="2550.00"></td>
            </tr>
        </tbody>
    </table>
    <button class="save-btn" onclick="veriKaydet()">Değişiklikleri Kaydet</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();

        function veriKaydet() {
            let satir = document.querySelector('#table-body tr');
            let data = {
                tarih: satir.querySelector('.tarih').value,
                saat: satir.querySelector('.saat').value,
                parabirimi: satir.querySelector('.parabirimi').value,
                lot: satir.querySelector('.lot').value,
                giris: satir.querySelector('.giris').value,
                cikis: satir.querySelector('.cikis').value
            };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
